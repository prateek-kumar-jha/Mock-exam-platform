version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: exam-platform-postgres
    environment:
      POSTGRES_DB: exam_platform
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: exam-platform-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pg_data: