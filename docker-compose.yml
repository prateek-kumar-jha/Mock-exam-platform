services:
  postgres:
    image: postgres:15-alpine
    container_name: exam-platform-postgres
    environment:
      POSTGRES_DB: exam_platform
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: exam-platform-redis
    # appendonly yes: AOF fsyncs each write, so a hard crash loses at most ~1s
    # of jobs instead of up to 60s with RDB snapshots alone. Delayed
    # auto-submit jobs are the durability-critical payload here.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
